<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Fire &amp; Smoke Detection System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">PyroGuard AI</div>
      <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('live_detection') }}">Live Detection</a>
        <a href="{{ url_for('image_detection') }}">Image Detection</a>
        <a href="{{ url_for('video_detection') }}">Video Detection</a>
        <a href="{{ url_for('history') }}">Detection History</a>
        <a href="{{ url_for('analytics') }}">Analytics</a>
      </nav>
      <button id="themeToggle" type="button" class="btn-secondary">Toggle Dark Mode</button>
    </aside>
    <main class="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
